<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Блок-дизайн · комбинаторика баланса — BIBD, плоскость Фано, системы Штейнера</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #04070a; }

    /* console-deck shell (shared with llm-testing/router-cve/cham); cyan primary + violet + gold accent */
    #cham-app {
      --bg: #04070b;
      --panel: #0a1018;
      --panel-glass: rgba(10, 16, 24, 0.75);
      --border: rgba(34, 211, 238, 0.22);
      --border-light: rgba(255, 255, 255, 0.08);
      --text: #eaf6fb;
      --muted: #8fa3b3;
      --violet: #a855f7;
      --violet-glow: rgba(168, 85, 247, 0.45);
      --magenta: #ec4899;
      --cyan: #22d3ee;
      --cyan-glow: rgba(34, 211, 238, 0.4);
      --emerald: #10b981;
      --emerald-glow: rgba(16, 185, 129, 0.4);
      --amber: #f59e0b;
      --gold: #fbbf24;
      --blue: #3b82f6;
      --red: #ef4444;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    .mono { font-family: 'JetBrains Mono', monospace; }

    /* ── Top Story Navigator ── */
    .top-nav {
      flex-shrink: 0;
      height: 52px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 20px;
      overflow-x: auto;
      overflow-y: hidden;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(90deg, #071820 0%, #04070b 100%);
      scrollbar-width: thin;
      scrollbar-color: rgba(34, 211, 238, 0.3) transparent;
      z-index: 10;
    }
    .top-nav::-webkit-scrollbar { height: 3px; }
    .top-nav::-webkit-scrollbar-thumb { background: var(--cyan); border-radius: 3px; }

    .nav-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid var(--border-light);
      background: rgba(255, 255, 255, 0.025);
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .nav-badge:hover {
      color: #fff;
      border-color: var(--cyan);
      background: rgba(34, 211, 238, 0.12);
      transform: translateY(-1px);
    }
    .nav-badge.active {
      color: #04141a;
      background: linear-gradient(135deg, #67e8f9, #22d3ee);
      border-color: #67e8f9;
      box-shadow: 0 0 16px var(--cyan-glow);
    }
    .nav-badge .num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(0,0,0,0.25);
      color: inherit;
      font-size: 0.62rem;
      font-weight: 800;
    }
    .nav-sep { color: rgba(34, 211, 238, 0.35); font-size: 0.75rem; flex-shrink: 0; }

    /* ── Main Layout ── */
    .main-workspace {
      display: flex;
      flex: 1;
      min-height: 0;
      position: relative;
    }

    /* ── Left Narrative Deck ── */
    .deck-panel {
      width: 480px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, #071620 0%, #04070b 100%);
      z-index: 5;
      box-shadow: 10px 0 30px rgba(0, 0, 0, 0.5);
    }

    .brand-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .brand-title {
      font-size: 1.05rem;
      font-weight: 900;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: -0.02em;
    }
    .brand-title span { color: var(--violet); }
    .brand-subtitle { font-size: 0.7rem; color: var(--muted); font-weight: 500; margin-top: 2px; }

    .btn-presenter {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(34, 211, 238, 0.08);
      color: var(--cyan);
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-presenter:hover {
      background: rgba(34, 211, 238, 0.22);
      border-color: #67e8f9;
      color: #fff;
    }

    .deck-scroll {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 28px 32px;
      overflow-y: auto;
      min-height: 0;
    }
    .deck-scroll::-webkit-scrollbar { width: 4px; }
    .deck-scroll::-webkit-scrollbar-thumb { background: rgba(34, 211, 238, 0.25); border-radius: 2px; }

    .slide-view { display: none; animation: slideFade 0.35s ease-out; }
    .slide-view.active { display: block; }
    @keyframes slideFade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .slide-tag-line {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .slide-tag-line::before {
      content: '';
      display: block;
      width: 18px;
      height: 2px;
      background: currentColor;
      border-radius: 1px;
    }

    .slide-title {
      font-size: 1.85rem;
      font-weight: 900;
      color: #fff;
      line-height: 1.18;
      letter-spacing: -0.035em;
      margin-bottom: 18px;
    }

    .slide-desc {
      font-size: 1.02rem;
      line-height: 1.68;
      color: #cddbe4;
      margin-bottom: 18px;
    }
    .slide-desc strong { color: #fff; font-weight: 700; }
    .slide-desc .hl-cyan { color: var(--cyan); font-weight: 700; }
    .slide-desc .hl-violet { color: #c084fc; font-weight: 700; }
    .slide-desc .hl-emerald { color: var(--emerald); font-weight: 700; }
    .slide-desc .hl-amber { color: var(--amber); font-weight: 700; }
    .slide-desc .hl-gold { color: var(--gold); font-weight: 700; }
    .slide-desc .hl-red { color: var(--red); font-weight: 700; }
    .slide-desc .f {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      color: #fff;
      background: rgba(34,211,238,0.12);
      border: 1px solid rgba(34,211,238,0.3);
      border-radius: 5px;
      padding: 1px 6px;
      font-size: 0.9em;
      white-space: nowrap;
    }

    .callout-box {
      padding: 16px 18px;
      border-radius: 12px;
      background: rgba(34, 211, 238, 0.08);
      border: 1px solid rgba(34, 211, 238, 0.28);
      border-left: 4px solid var(--cyan);
      color: #c6e7ef;
      font-size: 0.92rem;
      line-height: 1.58;
      margin-top: 14px;
    }
    .callout-box.emerald {
      background: rgba(16, 185, 129, 0.07);
      border-color: rgba(16, 185, 129, 0.28);
      border-left-color: var(--emerald);
      color: #a7e5ce;
    }
    .callout-box.cyan {
      background: rgba(34, 211, 238, 0.07);
      border-color: rgba(34, 211, 238, 0.28);
      border-left-color: var(--cyan);
      color: #b2eaf5;
    }
    .callout-box.violet {
      background: rgba(168, 85, 247, 0.08);
      border-color: rgba(168, 85, 247, 0.3);
      border-left-color: var(--violet);
      color: #ddc4fb;
    }
    .callout-box.amber {
      background: rgba(245, 158, 11, 0.07);
      border-color: rgba(245, 158, 11, 0.28);
      border-left-color: var(--amber);
      color: #ecd29b;
    }
    .callout-box.gold {
      background: rgba(251, 191, 36, 0.08);
      border-color: rgba(251, 191, 36, 0.3);
      border-left-color: var(--gold);
      color: #f3dca0;
    }
    .callout-box.blue {
      background: rgba(59, 130, 246, 0.07);
      border-color: rgba(59, 130, 246, 0.28);
      border-left-color: var(--blue);
      color: #b9d6fc;
    }
    .callout-box.red {
      background: rgba(239, 68, 68, 0.08);
      border-color: rgba(239, 68, 68, 0.3);
      border-left-color: var(--red);
      color: #f6b9b9;
    }
    .callout-box b, .callout-box strong { color: #fff; }
    .callout-box .f {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      color: #fff;
      padding: 0 3px;
    }

    .code-badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(168, 85, 247, 0.14);
      border: 1px solid rgba(168, 85, 247, 0.32);
      color: #e2ccfb;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.88em;
      font-weight: 700;
    }

    /* ── Bottom Deck Controls ── */
    .deck-controls {
      display: flex;
      align-items: center;
      padding: 12px 18px;
      border-top: 1px solid var(--border);
      gap: 8px;
      flex-shrink: 0;
      background: #061019;
    }
    .ctl-btn {
      height: 34px;
      padding: 0 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .ctl-btn.icon-only { width: 34px; padding: 0; font-size: 15px; }
    .ctl-btn.primary {
      background: var(--cyan);
      color: #04141a;
      border: none;
      box-shadow: 0 0 14px var(--cyan-glow);
    }
    .ctl-btn.primary:hover:not(:disabled) { background: #67e8f9; color: #000; }
    .ctl-btn.ghost {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-light);
      color: var(--muted);
    }
    .ctl-btn.ghost:hover:not(:disabled) {
      border-color: var(--cyan);
      color: #fff;
      background: rgba(34, 211, 238, 0.1);
    }
    .ctl-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .deck-progress {
      flex: 1;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      overflow: hidden;
      margin: 0 4px;
    }
    .deck-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--violet), var(--cyan));
      transition: width 0.2s linear;
    }

    .slide-counter-badge {
      font-size: 0.74rem;
      font-weight: 800;
      color: var(--muted);
      white-space: nowrap;
    }

    .voice-toggle-label {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid var(--border-light);
      background: rgba(255, 255, 255, 0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
    }
    .voice-toggle-label input { position: absolute; opacity: 0; pointer-events: none; }
    .voice-toggle-label:hover { border-color: var(--cyan); }
    .voice-toggle-label input:checked + .v-icon { color: var(--cyan); filter: drop-shadow(0 0 6px var(--cyan)); }
    .v-icon { font-size: 15px; }

    /* ── Right Stage: Interactive Physics & Graphics ── */
    .stage-panel {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle at 60% 50%, #0a2029 0%, #04070c 80%);
      display: flex;
      flex-direction: column;
    }

    #stage-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Floating Canvas HUD Overlays */
    .stage-hud-top {
      position: absolute;
      top: 18px;
      left: 24px;
      right: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
    }
    .hud-pill {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(6, 14, 20, 0.85);
      border: 1px solid rgba(34, 211, 238, 0.35);
      backdrop-filter: blur(10px);
      font-size: 0.75rem;
      font-weight: 700;
      color: #dcefff;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .hud-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 8px var(--emerald);
      animation: hudPulse 1.8s infinite;
    }
    @keyframes hudPulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.85); } }

    .hud-controls-group {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hud-action-btn {
      padding: 7px 14px;
      border-radius: 14px;
      background: rgba(168, 85, 247, 0.18);
      border: 1px solid rgba(168, 85, 247, 0.45);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    }
    .hud-action-btn:hover {
      background: var(--violet);
      color: #fff;
      box-shadow: 0 0 16px var(--violet-glow);
      transform: translateY(-1px);
    }

    .stage-hud-bottom {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      width: max-content;
      max-width: min(560px, 88%);
    }
    .stage-scene-note {
      pointer-events: none;
      text-align: center;
      font-size: 0.78rem;
      font-weight: 600;
      line-height: 1.4;
      color: #a9c2d1;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
      max-width: 100%;
    }
    .stage-caption-pill {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 22px;
      border-radius: 30px;
      background: rgba(5, 12, 18, 0.92);
      border: 1px solid rgba(34, 211, 238, 0.45);
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      color: #edf6fa;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }
    .stage-caption-pill .cap-icon { color: var(--violet); font-size: 1rem; }

    .interactive-dock {
      position: absolute;
      bottom: 106px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 10;
    }

    .stage-legend {
      position: absolute;
      bottom: 20px;
      left: 24px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(5, 12, 18, 0.82);
      border: 1px solid rgba(34, 211, 238, 0.3);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 28px rgba(0,0,0,0.5);
      pointer-events: none;
      max-width: 250px;
    }
    .stage-legend .legend-title {
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2px;
    }
    .stage-legend .legend-item {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 0.82rem;
      font-weight: 700;
      color: #e0eef5;
      line-height: 1.2;
    }
    .stage-legend .legend-dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 8px currentColor;
    }

    .stage-fade {
      position: absolute;
      inset: 0;
      z-index: 9;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(circle at 60% 50%, #0a2029 0%, #04070c 80%);
    }
  </style>
</head>
<body>

<div id="cham-app">
  <nav class="top-nav" id="top-nav" aria-label="Путь презентации"></nav>

  <div class="main-workspace">

    <aside class="deck-panel">
      <div class="brand-header">
        <div>
          <div class="brand-title">◆ Блок-<span>дизайн</span></div>
          <div class="brand-subtitle">комбинаторика баланса · BIBD · плоскость Фано · системы Штейнера</div>
        </div>
        <button class="btn-presenter" id="btn-presenter" title="Открыть пульт докладчика">🖥 Пульт</button>
      </div>

      <div class="deck-scroll" id="deck-scroll"></div>

      <div class="deck-controls">
        <button id="btn-prev" class="ctl-btn ghost icon-only" aria-label="Назад" disabled>‹</button>
        <button id="btn-play" class="ctl-btn primary">▶ Играть</button>
        <button id="btn-restart" class="ctl-btn ghost icon-only" title="В начало">↺</button>
        <div class="deck-progress"><div class="deck-progress-fill" id="progress-bar"></div></div>
        <span class="slide-counter-badge" id="slide-counter">1 / 12</span>
        <label class="voice-toggle-label" title="Озвучка (TTS)" aria-label="Голос">
          <input type="checkbox" id="voice-toggle">
          <span class="v-icon">🗣️</span>
        </label>
        <select id="vpick-select" title="Голос докладчика" aria-label="Голос докладчика" style="height:32px;border:1px solid #30363d;border-radius:7px;background:#0d1117;color:#c9d1d9;padding:0 8px;font:inherit;font-size:.8rem;cursor:pointer;max-width:160px;">
          <option value="edge:ru-RU-DmitryNeural">🤖 Стандартный</option>
          <option value="elevenlabs:mine">🎙 Мой голос</option>
        </select>
        <script>window.__voiceSlug=function(v){v=String(v||'');return v.indexOf('elevenlabs')===0?'mine':'edge';};</script>
<script>(function(){var K='presentationVoiceChoice',D='elevenlabs:mine',s=document.getElementById('vpick-select');var v=localStorage.getItem(K);if(!v){v=D;localStorage.setItem(K,D);}s.value=[].some.call(s.options,function(o){return o.value===v})?v:D;s.addEventListener('change',function(){localStorage.setItem(K,s.value||D);});})();</script>
        <button id="btn-next" class="ctl-btn ghost">Далее ›</button>
      </div>
    </aside>

    <main class="stage-panel">
      <canvas id="stage-canvas"></canvas>
      <div class="stage-fade" id="stage-fade"></div>
      <div class="stage-legend" id="stage-legend"></div>

      <div class="stage-hud-top">
        <div class="hud-pill">
          <span class="hud-dot" id="hud-status-dot"></span>
          <span id="hud-status-text">Block Design Lab · 60 FPS</span>
        </div>
        <div class="hud-controls-group" id="hud-actions"></div>
      </div>

      <div class="interactive-dock" id="interactive-dock"></div>

      <div class="stage-hud-bottom">
        <div class="stage-caption-pill">
          <span class="cap-icon">✦</span>
          <span id="stage-caption-text">Инициализация…</span>
        </div>
        <div class="stage-scene-note" id="stage-scene-note"></div>
      </div>
    </main>

  </div>
</div>

<script src="mqtt.min.js"></script>
<script src="preza-sync.js"></script>
<script>
(function() {
  'use strict';

  // ═══════════════════════════════════════════════════════════════════════════
  // COLORS
  // ═══════════════════════════════════════════════════════════════════════════
  const CY = '#22d3ee', EM = '#10b981', RED = '#ef4444', AMB = '#f59e0b',
        VIO = '#a855f7', BLUE = '#3b82f6', MAG = '#ec4899', GOLD = '#fbbf24', MUT = '#64748b';

  // Fano plane (7,3,1): points 0..6 = 1..7; 7 lines (last one is the circle F·D·E)
  // pt index: 0=A(top) 1=B(bl) 2=C(br) 3=F(mid AB) 4=D(mid BC) 5=E(mid CA) 6=G(center)
  const FANO_LINES = [[0,3,1],[1,4,2],[2,5,0],[0,6,4],[1,6,5],[2,6,3],[3,4,5]];

  // Simulator slide: parameter value-counts of a process graph (ветки/таймауты/ретраи/входы/флаг)
  const SIM_VALS = [3, 3, 2, 2, 2]; // full product = 72
  // Greedy strength-2 covering array — guaranteed to cover EVERY pair of values (loops until dry).
  function buildCA(vals) {
    const k = vals.length;
    const key = (i, a, j, b) => i + ':' + a + '-' + j + ':' + b;
    const need = new Set();
    for (let i = 0; i < k; i++) for (let j = i + 1; j < k; j++)
      for (let a = 0; a < vals[i]; a++) for (let b = 0; b < vals[j]; b++) need.add(key(i, a, j, b));
    const rows = [];
    let guard = 0;
    while (need.size && guard++ < 300) {
      let best = null, bestCov = -1;
      for (let tries = 0; tries < 60; tries++) {
        const row = vals.map(v => Math.floor(Math.random() * v));
        let cov = 0;
        for (let i = 0; i < k; i++) for (let j = i + 1; j < k; j++) if (need.has(key(i, row[i], j, row[j]))) cov++;
        if (cov > bestCov) { bestCov = cov; best = row; }
      }
      rows.push(best);
      for (let i = 0; i < k; i++) for (let j = i + 1; j < k; j++) need.delete(key(i, best[i], j, best[j]));
    }
    return rows;
  }

  const canvas = document.getElementById('stage-canvas');
  const ctx = canvas.getContext('2d');

  // Projector readability: enlarge EVERY on-canvas label uniformly.
  const FONT_SCALE = 1.32;
  const _fontDesc = Object.getOwnPropertyDescriptor(CanvasRenderingContext2D.prototype, 'font');
  Object.defineProperty(ctx, 'font', {
    configurable: true,
    get() { return _fontDesc.get.call(this); },
    set(v) {
      _fontDesc.set.call(this, String(v).replace(/(\d+(?:\.\d+)?)px/, (m, n) => (parseFloat(n) * FONT_SCALE).toFixed(1) + 'px'));
    }
  });

  let width = 0, height = 0, dpr = 1;
  function resizeCanvas() {
    dpr = window.devicePixelRatio || 1;
    const rect = canvas.parentElement.getBoundingClientRect();
    width = rect.width; height = rect.height;
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    ctx.resetTransform && ctx.resetTransform();
    ctx.scale(dpr, dpr);
  }
  window.addEventListener('resize', resizeCanvas);

  let currentSlide = 0;
  let animTime = 0;
  let shockwaves = [];
  let sparks = [];
  let customState = {};

  function addSparks(x, y, color, count = 16, maxSpeed = 5) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 1 + Math.random() * maxSpeed;
      sparks.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
        life: 1.0, decay: 0.02 + Math.random() * 0.03, color, size: 2 + Math.random() * 3 });
    }
  }
  function addShockwave(x, y, color, maxRadius = 80) {
    shockwaves.push({ x, y, radius: 5, maxRadius, life: 1.0, decay: 0.03, color });
  }

  // ── Shared draw helpers ──
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function box(x, y, w, h, color, title, sub, opts) {
    opts = opts || {};
    ctx.save();
    rr(x, y, w, h, opts.radius || 12);
    ctx.fillStyle = opts.bg || 'rgba(8,16,24,0.88)';
    ctx.fill();
    ctx.lineWidth = opts.lw || 2;
    ctx.strokeStyle = color;
    ctx.shadowColor = color; ctx.shadowBlur = opts.glow != null ? opts.glow : 14;
    ctx.stroke(); ctx.shadowBlur = 0;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (title) {
      ctx.fillStyle = '#fff'; ctx.font = '700 15px Inter';
      ctx.fillText(title, x + w / 2, y + h / 2 - (sub ? 9 : 0));
    }
    if (sub) { ctx.fillStyle = color; ctx.font = '700 12px JetBrains Mono'; ctx.fillText(sub, x + w / 2, y + h / 2 + 11); }
    ctx.restore();
  }
  function line(x1, y1, x2, y2, color, w, dash) {
    ctx.save();
    ctx.strokeStyle = color; ctx.lineWidth = w || 2;
    if (dash) ctx.setLineDash(dash);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.restore();
  }
  function flowDots(x1, y1, x2, y2, color, speed, count, size) {
    for (let i = 0; i < count; i++) {
      const t = ((animTime * speed + i / count) % 1);
      const x = x1 + (x2 - x1) * t, y = y1 + (y2 - y1) * t;
      ctx.save();
      ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 8;
      ctx.globalAlpha = 0.35 + 0.5 * Math.sin(t * Math.PI);
      ctx.beginPath(); ctx.arc(x, y, size || 3, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }
  function label(txt, x, y, color, size, weight, align) {
    ctx.save();
    ctx.fillStyle = color; ctx.font = (weight || 700) + ' ' + (size || 13) + 'px Inter';
    ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(txt, x, y); ctx.restore();
  }
  function mono(txt, x, y, color, size, align) {
    ctx.save();
    ctx.fillStyle = color; ctx.font = '700 ' + (size || 13) + 'px JetBrains Mono';
    ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(txt, x, y); ctx.restore();
  }
  // horizontal progress/score bar
  function bar(x, y, w, h, frac, color) {
    ctx.save();
    rr(x, y, w, h, h / 2); ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fill();
    if (frac > 0) {
      rr(x, y, Math.max(h, w * Math.min(1, frac)), h, h / 2);
      ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 8; ctx.fill();
    }
    ctx.restore();
  }
  // filled point (a "point" of the design)
  function dot(x, y, r, color, glow) {
    ctx.save();
    ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = glow != null ? glow : 10;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  // formula chip — designed pill with mono text (the whole point of this deck: formulas as art)
  function formula(txt, x, y, color, size, opts) {
    opts = opts || {};
    size = size || 16;
    ctx.save();
    ctx.font = '800 ' + size + 'px JetBrains Mono';
    const tw = ctx.measureText(txt).width;
    const padX = 16, h = size * FONT_SCALE + 18, w = tw + padX * 2;
    const x0 = opts.align === 'left' ? x : (opts.align === 'right' ? x - w : x - w / 2);
    rr(x0, y - h / 2, w, h, 10);
    ctx.fillStyle = opts.bg || 'rgba(5,12,18,0.94)';
    ctx.fill();
    ctx.lineWidth = 1.8; ctx.strokeStyle = color;
    ctx.shadowColor = color; ctx.shadowBlur = opts.glow != null ? opts.glow : 14; ctx.stroke(); ctx.shadowBlur = 0;
    ctx.fillStyle = opts.textColor || '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '800 ' + size + 'px JetBrains Mono';
    ctx.fillText(txt, x0 + w / 2, y + 1);
    ctx.restore();
    return { w, h, x0 };
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // SCENE INITIALIZATION
  // ═══════════════════════════════════════════════════════════════════════════
  function seedIntro() {
    const pts = [];
    // 3 target blocks × 3 points arranged neatly on the right
    for (let i = 0; i < 9; i++) {
      pts.push({
        rx: 0.12 + Math.random() * 0.34, ry: 0.18 + Math.random() * 0.64,
        block: Math.floor(i / 3)
      });
    }
    customState.pts = pts; customState.asm = 0;
  }

  function initScene(slideIndex) {
    shockwaves = []; sparks = []; customState = {};
    const mode = slidesData[slideIndex].mode;

    if (mode === 'intro') seedIntro();
    else if (mode === 'bibd_def') { customState.hl = 0; customState.pair = [1, 3]; }
    else if (mode === 'params') { customState.reveal = 0; }
    else if (mode === 'relations') { customState.countT = 0; }
    else if (mode === 'fisher') { customState.grow = 0; }
    else if (mode === 'fano') { customState.lineT = 0; customState.activeLine = 0; }
    else if (mode === 'symmetric') { customState.n = 2; customState.reveal = 0; }
    else if (mode === 'steiner') { customState.v = 7; customState.reveal = 0; }
    else if (mode === 'kirkman') { customState.day = 0; customState.morph = 1; }
    else if (mode === 'existence') { customState.checkT = 0; }
    else if (mode === 'applications') { customState.t = 0; }
    else if (mode === 'simulator') { customState.t = 0; customState.ca = buildCA(SIM_VALS); }

    renderHUDControls(slideIndex);
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // HUD CONTROLS
  // ═══════════════════════════════════════════════════════════════════════════
  function renderHUDControls(slideIndex) {
    const hudGroup = document.getElementById('hud-actions');
    const dockGroup = document.getElementById('interactive-dock');
    hudGroup.innerHTML = ''; dockGroup.innerHTML = '';
    const mode = slidesData[slideIndex].mode;

    const hudBtn = (html, onclick) => {
      const b = document.createElement('button');
      b.className = 'hud-action-btn'; b.innerHTML = html; b.onclick = onclick;
      hudGroup.appendChild(b);
    };

    if (mode === 'intro') {
      hudBtn('🎲 Пересобрать', () => { seedIntro(); });
    } else if (mode === 'bibd_def') {
      hudBtn('✨ Подсветить пару', () => {
        // pick a fresh pair of points that share exactly λ=1 block in Fano
        const a = Math.floor(Math.random() * 7);
        let b = Math.floor(Math.random() * 7); while (b === a) b = Math.floor(Math.random() * 7);
        customState.pair = [a, b]; customState.hl = 0;
      });
    } else if (mode === 'params') {
      hudBtn('🔢 Перестроить', () => { customState.reveal = 0; });
    } else if (mode === 'relations') {
      hudBtn('🔢 Пересчитать', () => { customState.countT = 0; });
    } else if (mode === 'fisher') {
      hudBtn('📊 Заново', () => { customState.grow = 0; });
    } else if (mode === 'fano') {
      hudBtn('▶ Прогнать прямые', () => { customState.lineT = 0; customState.activeLine = 0; });
    } else if (mode === 'symmetric') {
      hudBtn('⟳ n + 1', () => { customState.n = customState.n >= 4 ? 2 : customState.n + 1; customState.reveal = 0; });
    } else if (mode === 'steiner') {
      hudBtn('⟳ v: 7 ↔ 9', () => { customState.v = customState.v === 7 ? 9 : 7; customState.reveal = 0; });
    } else if (mode === 'kirkman') {
      hudBtn('📅 Следующий день', () => { customState.day = (customState.day + 1) % 7; customState.morph = 0; });
    } else if (mode === 'existence') {
      hudBtn('🔍 Проверить (43,7,1)', () => { customState.checkT = 0; });
    } else if (mode === 'simulator') {
      hudBtn('🎲 Другой набор', () => { customState.ca = buildCA(SIM_VALS); customState.t = 0; });
    }
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // MAIN LOOP
  // ═══════════════════════════════════════════════════════════════════════════
  function animate() {
    requestAnimationFrame(animate);
    if (document.hidden) return; // pause heavy canvas work when tab/window not visible
    animTime += 0.016;
    ctx.clearRect(0, 0, width, height);
    drawBackgroundGrid();

    const mode = slidesData[currentSlide].mode;
    if (mode === 'intro') renderIntro();
    else if (mode === 'bibd_def') renderBibdDef();
    else if (mode === 'params') renderParams();
    else if (mode === 'relations') renderRelations();
    else if (mode === 'fisher') renderFisher();
    else if (mode === 'fano') renderFano();
    else if (mode === 'symmetric') renderSymmetric();
    else if (mode === 'steiner') renderSteiner();
    else if (mode === 'kirkman') renderKirkman();
    else if (mode === 'existence') renderExistence();
    else if (mode === 'applications') renderApplications();
    else if (mode === 'simulator') renderSimulator();

    renderEffects();
  }

  function drawBackgroundGrid() {
    ctx.save();
    ctx.strokeStyle = 'rgba(34, 211, 238, 0.05)';
    ctx.lineWidth = 1;
    const step = 44;
    for (let x = 0; x < width; x += step) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke(); }
    for (let y = 0; y < height; y += step) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke(); }
    ctx.restore();
  }

  // Fano point layout given center + radius → array of {x,y}
  function fanoPoints(cx, cy, R) {
    const A = { x: cx, y: cy - R };
    const B = { x: cx - R * 0.866, y: cy + R * 0.5 };
    const C = { x: cx + R * 0.866, y: cy + R * 0.5 };
    const F = { x: (A.x + B.x) / 2, y: (A.y + B.y) / 2 };
    const D = { x: (B.x + C.x) / 2, y: (B.y + C.y) / 2 };
    const E = { x: (C.x + A.x) / 2, y: (C.y + A.y) / 2 };
    const G = { x: cx, y: cy };
    return [A, B, C, F, D, E, G];
  }

  // ── Scene 1: intro (chaos → blocks) ──
  function renderIntro() {
    customState.asm = Math.min(1, (customState.asm || 0) + 0.006);
    const a = customState.asm;
    const ease = a < 0.5 ? 2 * a * a : 1 - Math.pow(-2 * a + 2, 2) / 2;
    const pts = customState.pts;
    const blockColors = [CY, VIO, GOLD];
    // target positions: 3 blocks stacked on the right
    const bx = width * 0.72;
    const target = pts.map((p, i) => {
      const bi = p.block, within = i % 3;
      const by = height * (0.27 + bi * 0.23);
      const ang = -Math.PI / 2 + within / 3 * Math.PI * 2;
      return { x: bx + Math.cos(ang) * 52, y: by + Math.sin(ang) * 40 };
    });

    // block ovals appear as points settle
    if (a > 0.55) {
      for (let bi = 0; bi < 3; bi++) {
        const by = height * (0.27 + bi * 0.23);
        ctx.save();
        ctx.globalAlpha = Math.min(0.5, (a - 0.55) * 2);
        ctx.strokeStyle = blockColors[bi]; ctx.lineWidth = 2; ctx.setLineDash([7, 7]);
        ctx.beginPath(); ctx.ellipse(bx, by, 82, 62, 0, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
        label('блок ' + (bi + 1), bx + 96, by, blockColors[bi], 12, 800, 'left');
      }
    }

    pts.forEach((p, i) => {
      const sx = p.rx * width, sy = p.ry * height;
      const x = sx + (target[i].x - sx) * ease;
      const y = sy + (target[i].y - sy) * ease;
      const col = a > 0.5 ? blockColors[p.block] : GOLD;
      dot(x, y, 8, col, 12);
    });

    label(a < 0.6 ? 'набор точек' : 'набор → структура', width * 0.30, height * 0.10, GOLD, 14, 800);
    formula('множество  +  семья блоков  =  баланс', width * 0.5, height * 0.80,VIO, 15);
    if (a < 0.5) label('хаос', width * 0.28, height * 0.5, MUT, 13, 700);
  }

  // ── Scene 2: BIBD definition (Fano points + blocks, highlight a pair) ──
  function renderBibdDef() {
    customState.hl = Math.min(1, (customState.hl || 0) + 0.02);
    const cx = width * 0.46, cy = height * 0.50, R = Math.min(width, height) * 0.26;
    const P = fanoPoints(cx, cy, R);
    const [pa, pb] = customState.pair;

    // find the (single) block containing both pa & pb
    let hlLine = -1;
    FANO_LINES.forEach((ln, li) => { if (ln.includes(pa) && ln.includes(pb)) hlLine = li; });

    // draw all blocks faintly, highlight the one holding the pair
    FANO_LINES.forEach((ln, li) => {
      const on = li === hlLine;
      const col = on ? VIO : 'rgba(120,140,160,0.16)';
      drawFanoLine(P, ln, li, col, on ? 3 : 1.5, on ? 14 : 0);
    });

    // points
    P.forEach((p, i) => {
      const isPair = i === pa || i === pb;
      dot(p.x, p.y, isPair ? 11 : 8, isPair ? VIO : GOLD, isPair ? 18 : 8);
      label(String(i + 1), p.x, p.y - 20, isPair ? '#fff' : MUT, 12, 800);
    });

    // rules panel (right)
    const rx = width * 0.80, ry0 = height * 0.22;
    const rules = [
      ['v', 'точек всего', GOLD],
      ['k', 'точек в блоке', CY],
      ['r', 'блоков через точку', EM],
      ['λ', 'блоков на пару', VIO]
    ];
    rules.forEach((rl, i) => {
      const y = ry0 + i * 46;
      formula(rl[0], rx - 78, y, rl[2], 17, { align: 'left', glow: 8 });
      label(rl[1], rx - 30, y, '#cdd8e0', 12, 700, 'left');
    });

    formula('2-(v, k, λ)', width * 0.5, height * 0.80,CY, 17);
    label('подсвечена пара ' + (pa + 1) + '·' + (pb + 1) + ' → она в λ = 1 блоке', width / 2, height * 0.10, VIO, 13, 800);
  }

  function drawFanoLine(P, ln, li, color, w, glow) {
    ctx.save();
    ctx.strokeStyle = color; ctx.lineWidth = w;
    if (glow) { ctx.shadowColor = color; ctx.shadowBlur = glow; }
    if (li === 6) {
      // the circle through midpoints F(3),D(4),E(5)
      const cx = (P[3].x + P[4].x + P[5].x) / 3, cy = (P[3].y + P[4].y + P[5].y) / 3;
      const rad = Math.hypot(P[4].x - cx, P[4].y - cy);
      ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2); ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.moveTo(P[ln[0]].x, P[ln[0]].y);
      ctx.lineTo(P[ln[1]].x, P[ln[1]].y);
      ctx.lineTo(P[ln[2]].x, P[ln[2]].y);
      ctx.stroke();
    }
    ctx.restore();
  }

  // ── Scene 3: params — incidence matrix of (7,3,1) ──
  function renderParams() {
    customState.reveal = Math.min(1, (customState.reveal || 0) + 0.02);
    const rv = customState.reveal;
    const v = 7, b = 7, k = 3, r = 3;
    // matrix grid
    const gx = width * 0.30, gy = height * 0.26, cell = Math.min(width, height) * 0.072;
    const gw = b * cell, gh = v * cell;

    label('матрица инцидентности  ·  точки × блоки', gx + gw / 2, gy - 34, CY, 13, 800);

    // column headers (blocks) + row headers (points)
    for (let c = 0; c < b; c++) mono('B' + (c + 1), gx + c * cell + cell / 2, gy - 14, CY, 11, 'center');
    for (let rI = 0; rI < v; rI++) mono('' + (rI + 1), gx - 16, gy + rI * cell + cell / 2, GOLD, 12, 'center');

    // grid + cells
    for (let rI = 0; rI < v; rI++) {
      for (let c = 0; c < b; c++) {
        const on = FANO_LINES[c].includes(rI);
        const x = gx + c * cell, y = gy + rI * cell;
        ctx.save();
        rr(x + 2, y + 2, cell - 4, cell - 4, 5);
        const seq = (rI + c) / (v + b);
        const shown = rv > seq;
        if (on && shown) {
          ctx.fillStyle = 'rgba(34,211,238,0.9)'; ctx.shadowColor = CY; ctx.shadowBlur = 10; ctx.fill();
        } else {
          ctx.fillStyle = 'rgba(255,255,255,0.04)'; ctx.fill();
          ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(148,163,184,0.14)'; ctx.stroke();
        }
        ctx.restore();
        if (on && shown) mono('1', x + cell / 2, y + cell / 2, '#04141a', 12, 'center');
      }
    }

    // parameter chips on the right
    const px = width * 0.80;
    const params = [['v = 7', GOLD, 'точек'], ['b = 7', CY, 'блоков'], ['r = 3', EM, 'через точку'], ['k = 3', BLUE, 'в блоке'], ['λ = 1', VIO, 'на пару']];
    params.forEach((p, i) => {
      const y = height * 0.24 + i * 52;
      formula(p[0], px, y, p[1], 16, { align: 'left', glow: 8 });
      label(p[2], px + 96, y, '#aebfca', 11.5, 700, 'left');
    });

    formula('запись:  2-(7, 3, 1)', width * 0.5, height * 0.13, VIO, 16);
    label('в каждой строке ровно r=3, в каждом столбце ровно k=3', width * 0.5, height * 0.80, EM, 12.5, 800);
  }

  // ── Scene 4: relations — double counting → two laws ──
  function renderRelations() {
    customState.countT = Math.min(1, (customState.countT || 0) + 0.006);
    const t = customState.countT;

    // small incidence lattice: v points (left) linked to b blocks (right) — count flags
    const v = 7, b = 7, k = 3, r = 3;
    const lx = width * 0.16, rx = width * 0.52;
    const py0 = height * 0.18, pystep = (height * 0.64) / (v - 1);

    // draw points and blocks columns
    for (let i = 0; i < v; i++) {
      const y = py0 + i * pystep;
      dot(lx, y, 6, GOLD, 8);
    }
    for (let j = 0; j < b; j++) {
      const y = py0 + j * pystep;
      dot(rx, y, 6, CY, 8);
    }
    label('точки (v)', lx, py0 - 26, GOLD, 12, 800);
    label('блоки (b)', rx, py0 - 26, CY, 12, 800);

    // flags = incidences (point in block). Reveal progressively.
    let flags = 0;
    FANO_LINES.forEach((ln, j) => {
      const by = py0 + j * pystep;
      ln.forEach(pi => {
        const seq = flags / 21;
        flags++;
        if (t * 1.05 < seq) return;
        const py = py0 + pi * pystep;
        line(lx, py, rx, by, 'rgba(16,185,129,0.28)', 1.4);
      });
    });

    label('инцидентностей «точка ∈ блок»: ' + Math.min(21, Math.round(t * 21)) + ' / 21', width * 0.34, height * 0.80,EM, 13, 800);

    // the two laws (right)
    const fx = width * 0.80;
    formula('b · k = v · r', fx, height * 0.30, EM, 18, { glow: 14 });
    label('считаем инцидентности дважды', fx, height * 0.30 + 34, '#aebfca', 11.5, 700);
    formula('λ (v−1) = r (k−1)', fx, height * 0.52, VIO, 18, { glow: 14 });
    label('считаем пары вокруг точки', fx, height * 0.52 + 34, '#aebfca', 11.5, 700);

    // live check for (7,3,1)
    if (t > 0.9) {
      formula('7·3 = 7·3 = 21  ✓', fx, height * 0.70, CY, 14, { glow: 10 });
      formula('1·6 = 3·2 = 6  ✓', fx, height * 0.80, CY, 14, { glow: 10 });
    }
  }

  // ── Scene 5: Fisher inequality b ≥ v ──
  function renderFisher() {
    customState.grow = Math.min(1, (customState.grow || 0) + 0.012);
    const g = customState.grow;
    const baseY = height * 0.78, maxH = height * 0.5;
    const bx1 = width * 0.34, bx2 = width * 0.56, bw = width * 0.12;

    // v column
    const vH = maxH * 0.7 * g;
    ctx.save();
    rr(bx1 - bw / 2, baseY - vH, bw, vH, 10);
    ctx.fillStyle = 'rgba(251,191,36,0.28)'; ctx.strokeStyle = GOLD; ctx.lineWidth = 2;
    ctx.shadowColor = GOLD; ctx.shadowBlur = 14; ctx.fill(); ctx.stroke();
    ctx.restore();
    label('v', bx1, baseY + 22, GOLD, 18, 900);
    label('точки', bx1, baseY + 42, MUT, 12, 700);

  // ── Scene 7: symmetric designs + projective plane formula ──
  function renderSymmetric() {
    customState.reveal = Math.min(1, (customState.reveal || 0) + 0.02);
    const n = customState.n;
    const v = n * n + n + 1, k = n + 1;

    // square incidence matrix v×v
    const size = Math.min(width * 0.42, height * 0.62);
    const gx = width * 0.30 - size / 2 + width * 0.02, gy = height * 0.5 - size / 2;
    const cell = size / v;
    label('матрица инцидентности  b = v  (квадрат ' + v + '×' + v + ')', gx + size / 2, gy - 26, CY, 12.5, 800);
    // deterministic-ish pattern (cyclic difference set feel) just for the visual
    for (let rI = 0; rI < v; rI++) {
      for (let c = 0; c < v; c++) {
        const on = ((rI * 1 + c * (n)) % v) < k; // pseudo pattern, k ones per row
        const x = gx + c * cell, y = gy + rI * cell;
        ctx.save();
        rr(x + 1, y + 1, cell - 2, cell - 2, 3);
        if (on) { ctx.fillStyle = 'rgba(34,211,238,0.85)'; ctx.shadowColor = CY; ctx.shadowBlur = 6; ctx.fill(); }
        else { ctx.fillStyle = 'rgba(255,255,255,0.035)'; ctx.fill(); }
        ctx.restore();
      }
    }

    // formulas on the right
    const fx = width * 0.80;
    formula('b = v   ⇒   r = k', fx, height * 0.24, VIO, 17, { glow: 12 });
    formula('v = b = n²+n+1', fx, height * 0.40, GOLD, 17, { glow: 12 });
    formula('k = r = n + 1', fx, height * 0.52, CY, 16, { glow: 10 });
    formula('n = ' + n + '  →  v = ' + v, fx, height * 0.66, EM, 16, { glow: 12 });
    label('два блока пересекаются ровно в λ точках', fx, height * 0.78, '#c084fc', 12.5, 800);

    label('симметричные схемы · проективные плоскости (λ=1)', width * 0.5, height * 0.80,VIO, 13, 800);
  }

  // ── Scene 8: Steiner triple systems + t-designs ──
  function renderSteiner() {
    customState.reveal = Math.min(1, (customState.reveal || 0) + 0.015);
    const v = customState.v;
    const cx = width * 0.44, cy = height * 0.50, R = Math.min(width, height) * 0.30;

    // points on a circle
    const P = [];
    for (let i = 0; i < v; i++) {
      const ang = -Math.PI / 2 + i / v * Math.PI * 2;
      P.push({ x: cx + Math.cos(ang) * R, y: cy + Math.sin(ang) * R });
    }
    // triples: for v=7 use Fano lines; for v=9 use affine plane AG(2,3) (12 lines)
    let triples;
    if (v === 7) triples = FANO_LINES.map(l => l.slice());
    else triples = STS9;

    triples.forEach((tr, ti) => {
      const appear = customState.reveal * triples.length;
      if (ti > appear) return;
      const hue = ti / triples.length;
      const col = ti === Math.floor(appear) ? '#fff' : `hsla(${180 + hue * 160},70%,60%,0.5)`;
      ctx.save();
      ctx.strokeStyle = col; ctx.lineWidth = ti === Math.floor(appear) ? 3 : 1.6;
      if (ti === Math.floor(appear)) { ctx.shadowColor = CY; ctx.shadowBlur = 12; }
      ctx.beginPath();
      ctx.moveTo(P[tr[0]].x, P[tr[0]].y);
      ctx.lineTo(P[tr[1]].x, P[tr[1]].y);
      ctx.lineTo(P[tr[2]].x, P[tr[2]].y);
      ctx.closePath(); ctx.stroke();
      ctx.restore();
    });
    P.forEach((p, i) => { dot(p.x, p.y, 8, GOLD, 10); label(String(i + 1), p.x, p.y, '#04141a', 10, 800); });

    // formulas
    const fx = width * 0.83;
    formula('S(2, 3, ' + v + ')', fx, height * 0.26, GOLD, 18, { align: 'right', glow: 12 });
    label('каждая пара — ровно в 1 тройке', fx, height * 0.26 + 34, '#aebfca', 11.5, 700, 'right');
    formula('t-(v, k, λ)', fx, height * 0.46, VIO, 17, { align: 'right', glow: 12 });
    label('каждое t-подмн. — в λ блоках', fx, height * 0.46 + 34, '#c084fc', 11.5, 700, 'right');
    formula('t-схема (t≥2) ⇒ 2-схема', fx, height * 0.64, CY, 13, { align: 'right', glow: 10 });
    label('троек: ' + triples.length + '  ·  ' + (v === 7 ? 'плоскость Фано' : 'аффинная плоскость AG(2,3)'), width * 0.44, height * 0.80,CY, 12.5, 800);
    label('S(2,3,v) существует при v ≡ 1, 3 (mod 6):  7, 9, 13, 15…', width * 0.44, height * 0.10, GOLD, 12.5, 800);
  }

  // ── Scene 12: how we apply it in simulator (pairwise / covering array) ──
  function renderSimulator() {
    customState.t = Math.min(1, (customState.t || 0) + 0.006);
    const t = customState.t;
    const ca = customState.ca || [];
    const runs = ca.length;
    const full = SIM_VALS.reduce((a, b) => a * b, 1);
    const valColors = [CY, VIO, GOLD, EM, MAG];

    label('как мы: комбинаторное тестирование графов simulator', width / 2, height * 0.075, EM, 14, 800);

    // ── process graph (конструктор-стиль) ──
    const gy = height * 0.21;
    const nodes = [
      { x: width * 0.15, ty: 'START', t: 'Старт',     color: EM },
      { x: width * 0.38, ty: 'LOGIC', t: 'Условие',   color: CY },
      { x: width * 0.61, ty: 'API',   t: 'API-вызов', color: VIO },
      { x: width * 0.83, ty: 'REPLY', t: 'Ответ',     color: GOLD }
    ];
    for (let i = 0; i < nodes.length - 1; i++) {
      const a = nodes[i], b = nodes[i + 1];
      line(a.x + 78, gy, b.x - 82, gy, 'rgba(148,163,184,0.35)', 2);
      arrow(b.x - 80, gy, 'rgba(180,200,215,0.7)');
      for (let r = 0; r < Math.min(runs, 5); r++) {
        const off = (animTime * 0.35 + r / 5 + i * 0.04) % 1;
        const x = a.x + 78 + (b.x - 82 - (a.x + 78)) * off;
        dot(x, gy, 4, valColors[r % valColors.length], 8);
      }
    }
    nodes.forEach(n => {
      const w = 156, h = 64;
      box(n.x - w / 2, gy - h / 2, w, h, n.color, '', '', { glow: 12, bg: 'rgba(9,17,26,0.96)' });
      ctx.save();
      rr(n.x - w / 2 + 12, gy - h / 2 + 9, 60, 17, 5);
      ctx.fillStyle = n.color; ctx.globalAlpha = 0.9; ctx.fill(); ctx.restore();
      mono(n.ty, n.x - w / 2 + 42, gy - h / 2 + 17, '#04141a', 8.5, 'center');
      dot(n.x + w / 2 - 15, gy - h / 2 + 17, 4, n.color, 8);
      label(n.t, n.x, gy + 9, '#fff', 13, 800);
    });
    label('у графа много «ручек»: ветки · таймауты · ретраи · входные данные', width / 2, height * 0.33, MUT, 11.5, 700);

    // ── covering array matrix ──
    const cols = SIM_VALS.length;
    const gx = width * 0.29;
    const cellW = width * 0.072;
    const my = height * 0.42;
    const cellH = Math.min(28, (height * 0.40) / Math.max(runs, 1));
    label('покрывающий массив · строка = прогон графа', gx, my - 22, CY, 12, 800, 'left');
    for (let c = 0; c < cols; c++) mono('P' + (c + 1), gx + c * cellW + cellW / 2, my - 4, CY, 10, 'center');
    ca.forEach((row, r) => {
      if (r > t * runs) return;
      const y = my + 8 + r * cellH;
      row.forEach((val, c) => {
        const x = gx + c * cellW;
        const col = valColors[val % valColors.length];
        ctx.save();
        rr(x + 3, y + 2, cellW - 6, cellH - 4, 5);
        ctx.fillStyle = col; ctx.globalAlpha = 0.85; ctx.shadowColor = col; ctx.shadowBlur = 6; ctx.fill();
        ctx.restore();
        mono('v' + (val + 1), x + cellW / 2, y + cellH / 2, '#04141a', 9.5, 'center');
      });
    });

    // ── numbers (right) ──
    const fx = width * 0.845;
    formula('перебор: ' + full, fx, height * 0.44, RED, 15, { glow: 12 });
    label(SIM_VALS.join(' · ') + ' сочетаний', fx, height * 0.44 + 30, '#f6b9b9', 10.5, 700);
    formula('pairwise: ' + runs, fx, height * 0.58, EM, 17, { glow: 14 });
    label('прогонов графа', fx, height * 0.58 + 30, '#a7e5ce', 10.5, 700);
    formula('экономия ×' + (full / Math.max(runs, 1)).toFixed(1), fx, height * 0.70, GOLD, 14, { glow: 12 });
    label('все пары значений покрыты ✓', fx, height * 0.78, '#bfe9d6', 11.5, 800);
  }

  // ── Effects ──
  function renderEffects() {
    for (let i = shockwaves.length - 1; i >= 0; i--) {
      const sw = shockwaves[i];
      sw.radius += (sw.maxRadius - sw.radius) * 0.12; sw.life -= sw.decay;
      if (sw.life <= 0) { shockwaves.splice(i, 1); continue; }
      ctx.save(); ctx.strokeStyle = sw.color; ctx.globalAlpha = sw.life; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
      const sp = sparks[i];
      sp.x += sp.vx; sp.y += sp.vy; sp.life -= sp.decay;
      if (sp.life <= 0) { sparks.splice(i, 1); continue; }
      ctx.save(); ctx.fillStyle = sp.color; ctx.globalAlpha = sp.life; ctx.shadowColor = sp.color; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(sp.x, sp.y, sp.size, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }
  }

  const topNav = document.getElementById('top-nav');
  const deckScroll = document.getElementById('deck-scroll');
  const btnPrev = document.getElementById('btn-prev');
  const btnNext = document.getElementById('btn-next');
  const btnPlay = document.getElementById('btn-play');
  const btnRestart = document.getElementById('btn-restart');
  const voiceToggle = document.getElementById('voice-toggle');
  const progressBar = document.getElementById('progress-bar');
  const slideCounter = document.getElementById('slide-counter');
  const captionText = document.getElementById('stage-caption-text');
  const sceneNote = document.getElementById('stage-scene-note');
  const btnPresenter = document.getElementById('btn-presenter');

  const storyNavBadges = [];
  const slideViews = [];

  const LEGENDS = {
    intro:       [[GOLD, 'точки'], [CY, 'блок'], [VIO, 'баланс = структура']],
    bibd_def:    [[GOLD, 'точки (v)'], [CY, 'блоки (k, r)'], [VIO, 'пара → λ блоков']],
    params:      [[CY, '1 — точка в блоке'], [GOLD, 'строка = точка'], [CY, 'столбец = блок']],
    relations:   [[GOLD, 'точки'], [CY, 'блоки'], [EM, 'инцидентность (флаг)']],
    fisher:      [[GOLD, 'v — точки'], [CY, 'b — блоки'], [VIO, 'b = v: симметричная']],
    fano:        [[GOLD, 'точка'], [CY, 'активная прямая'], [MUT, 'прочие прямые']],
    symmetric:   [[CY, 'инцидентность'], [VIO, 'b=v ⇒ r=k'], [GOLD, 'v=n²+n+1']],
    steiner:     [[GOLD, 'точки'], [CY, 'тройки-блоки'], [VIO, 't-подмножество']],
    kirkman:     [[CY, 'класс 1'], [VIO, 'класс 2'], [GOLD, 'класс 3'], [EM, 'класс 4'], [MAG, 'класс 5']],
    existence:   [[EM, 'существует'], [RED, 'не существует'], [AMB, 'арифметика ✓']],
    applications:[[VIO, 'матрица инцидентности'], [EM, 'применения'], [GOLD, 'баланс']],
    simulator:   [[CY, 'значение v1'], [VIO, 'v2'], [GOLD, 'v3'], [EM, 'меньше прогонов — все пары']]
  };
  const legendEl = document.getElementById('stage-legend');
  const stageFade = document.getElementById('stage-fade');

  function updateLegend(index) {
    const rows = LEGENDS[slidesData[index].mode];
    if (!rows) { legendEl.style.display = 'none'; return; }
    legendEl.style.display = 'flex';
    legendEl.innerHTML = '<div class="legend-title">Обозначения</div>' + rows.map(
      ([c, l]) => `<div class="legend-item"><span class="legend-dot" style="background:${c};color:${c}"></span>${l}</div>`
    ).join('');
  }

  function buildUI() {
    slidesData.forEach((s, idx) => {
      if (idx > 0) {
        const sep = document.createElement('span');
        sep.className = 'nav-sep'; sep.textContent = '→'; topNav.appendChild(sep);
      }
      const b = document.createElement('button');
      b.className = 'nav-badge' + (idx === 0 ? ' active' : '');
      b.innerHTML = `<span class="num">${idx + 1}</span><span>${s.storyLabel}</span>`;
      b.onclick = () => goToSlide(idx, { forceSpeak: voiceToggle.checked });
      topNav.appendChild(b);
      storyNavBadges.push(b);

      const slide = document.createElement('div');
      slide.className = 'slide-view' + (idx === 0 ? ' active' : '');
      slide.innerHTML = `
        <div class="slide-tag-line" style="color: ${s.tagColor}">${s.icon} ${s.tag}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="slide-desc">${s.desc}</div>
        <div class="callout-box ${s.calloutClass}">${s.callout}</div>
      `;
      deckScroll.appendChild(slide);
      slideViews.push(slide);
    });
    updateUI();
  }

  function goToSlide(index, options = {}) {
    if (index < 0 || index >= slidesData.length) return;
    currentSlide = index;
    if (stageFade) { stageFade.style.transition = 'none'; stageFade.style.opacity = '1'; }
    initScene(index);
    updateUI();
    updatePresenterWindow(index);
    if (stageFade) {
      requestAnimationFrame(() => requestAnimationFrame(() => {
        stageFade.style.transition = 'opacity 0.45s ease'; stageFade.style.opacity = '0';
      }));
    }
    if (ttsAudio) { ttsAudio.pause(); ttsAudio = null; }
    isPlaying = false; btnPlay.textContent = '▶ Играть'; progressBar.style.width = '0%';

    const shouldSpeak = voiceToggle.checked && options.forceSpeak;
    if (shouldSpeak) speakSlide(index);
    else { prefetch(index); prefetch(index + 1); }
  }

  function updateUI() {
    btnPrev.disabled = currentSlide === 0;
    btnNext.disabled = currentSlide === slidesData.length - 1;
    slideCounter.textContent = `${currentSlide + 1} / ${slidesData.length}`;
    captionText.textContent = slidesData[currentSlide].caption;
    if (sceneNote) sceneNote.textContent = slidesData[currentSlide].sceneNote || '';
    updateLegend(currentSlide);
    slideViews.forEach((v, i) => v.classList.toggle('active', i === currentSlide));
    storyNavBadges.forEach((b, i) => b.classList.toggle('active', i === currentSlide));
    const activeBadge = storyNavBadges[currentSlide];
    if (activeBadge) activeBadge.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // AUDIO & TTS
  // ═══════════════════════════════════════════════════════════════════════════
  let isPlaying = false;
  let ttsAudio = null;
  const preloadPool = {};
  const NARRATION_VERSION = 'blockdesign-12-20260909-v2';
  voiceToggle.checked = false;

  function ttsUrl(idx) {
    const voice = localStorage.getItem('presentationVoiceChoice') || '';
    return `narration/block_design/${__voiceSlug(voice)}/${idx}.mp3?v=${NARRATION_VERSION}`;
  }
  function prefetch(idx) {
    if (idx < 0 || idx >= slidesData.length || preloadPool[idx]) return;
    const a = new Audio(ttsUrl(idx)); a.preload = 'auto'; preloadPool[idx] = a;
  }
  function speakSlide(idx) {
    if (ttsAudio) { ttsAudio.pause(); ttsAudio = null; }
    isPlaying = true; btnPlay.textContent = '⏸ Пауза';
    const audio = preloadPool[idx] || new Audio(ttsUrl(idx));
    delete preloadPool[idx]; audio.preload = 'auto'; ttsAudio = audio;
    audio.addEventListener('timeupdate', () => {
      if (audio.duration) progressBar.style.width = ((audio.currentTime / audio.duration) * 100) + '%';
    });
    audio.addEventListener('ended', () => {
      isPlaying = false; btnPlay.textContent = '▶ Играть'; progressBar.style.width = '0%';
      if (currentSlide < slidesData.length - 1) goToSlide(currentSlide + 1, { forceSpeak: true });
    });
    audio.play().catch(() => { isPlaying = false; btnPlay.textContent = '▶ Играть'; });
    prefetch(idx + 1);
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // PRESENTER WINDOW
  // ═══════════════════════════════════════════════════════════════════════════
  let presenterWindow = null;
  let presenterRenderToken = 0;
  function getPresenterDoc() { return (presenterWindow && !presenterWindow.closed) ? presenterWindow.document : null; }
  function formatNarrationHtml(text) {
    const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const sentences = (text.match(/[^.!?…]+[.!?…]+["»)]*\s*/g) || [text]).map(s => s.trim()).filter(Boolean);
    const paras = [];
    for (let i = 0; i < sentences.length; i += 2) paras.push(sentences.slice(i, i + 2).join(' '));
    return paras.map(p => '<p>' + esc(p) + '</p>').join('') || esc(text);
  }
  function renderPresenter(index) {
    const doc = getPresenterDoc();
    if (!doc) return;
    const d = slidesData[index];
    const token = ++presenterRenderToken;
    const dotsHtml = slidesData.map((s, i) =>
      `<button class="p-dot${i === index ? ' active' : ''}" data-slide="${i}" style="--p-dot:${s.tagColor}"></button>`
    ).join('');
    doc.body.innerHTML = `
      <header>
        <div>
          <div class="eyebrow">🖥 Пульт докладчика · Блок-дизайн</div>
          <div class="counter">Слайд ${index + 1} из ${slidesData.length}</div>
        </div>
        <button id="closeBtn" class="close" title="Закрыть пульт">✕</button>
      </header>
      <main class="notes">
        <div class="pane-label">Точный текст озвучки &amp; Тезисы</div>
        <div class="pv-tag" style="color:${d.tagColor}">${d.icon} ${d.tag}</div>
        <h2>${d.title}</h2>
        <div id="narrContent" class="pv-text">Загрузка текста озвучки…</div>
        <div class="pv-callout">${d.callout}</div>
        ${PRESENTER_TIPS[index] ? `<div class="pv-tip"><span class="pv-tip-label">🎛 Что на сцене</span>${PRESENTER_TIPS[index]}</div>` : ''}
      </main>
      <footer>
        <button id="pPrevBtn" class="p-nav-btn" ${index === 0 ? 'disabled' : ''}>‹</button>
        <div class="dots-wrap">${dotsHtml}</div>
        <button id="pNextBtn" class="p-nav-btn" ${index === slidesData.length - 1 ? 'disabled' : ''}>›</button>
      </footer>
    `;
    doc.getElementById('closeBtn').onclick = () => presenterWindow.close();
    doc.getElementById('pPrevBtn').onclick = () => goToSlide(currentSlide - 1, { forceSpeak: voiceToggle.checked });
    doc.getElementById('pNextBtn').onclick = () => goToSlide(currentSlide + 1, { forceSpeak: voiceToggle.checked });
    doc.querySelectorAll('[data-slide]').forEach(b => {
      b.onclick = () => goToSlide(Number(b.dataset.slide), { forceSpeak: voiceToggle.checked });
    });
    fetch(`narration/block_design/${index}.json`)
      .then(r => { if (!r.ok) throw new Error('error'); return r.json(); })
      .then(p => {
        if (token !== presenterRenderToken) return;
        const dDoc = getPresenterDoc();
        const nEl = dDoc && dDoc.getElementById('narrContent');
        if (nEl) nEl.innerHTML = formatNarrationHtml(p.text);
      })
      .catch(() => {
        const dDoc = getPresenterDoc();
        const nEl = dDoc && dDoc.getElementById('narrContent');
        if (nEl) nEl.innerHTML = `<p>${d.desc}</p>`;
      });
  }
  function updatePresenterWindow(index) { if (getPresenterDoc()) renderPresenter(index); }

  async function openPresenter() {
    if (presenterWindow && !presenterWindow.closed) { presenterWindow.focus(); renderPresenter(currentSlide); return; }
    if ('documentPictureInPicture' in window) {
      try {
        presenterWindow = await documentPictureInPicture.requestWindow({
          width: Math.max(380, Math.min(540, Math.round(screen.availWidth * 0.26))),
          height: Math.max(540, Math.round(screen.availHeight * 0.88)),
          disallowReturnToOpener: true
        });
      } catch (e) { presenterWindow = null; }
    }
    if (!presenterWindow) presenterWindow = window.open('', 'block-design-presenter', 'popup=yes,width=520,height=760,resizable=yes,scrollbars=yes');
    if (!presenterWindow) { alert('Браузер заблокировал всплывающее окно. Разрешите всплывающие окна для пульта.'); return; }
    presenterWindow.document.write(`<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Пульт докладчика — Блок-дизайн</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; background: #061019; color: #bfd6e0; font-family: 'Inter', -apple-system, sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    header { position: sticky; top: 0; display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; background: #0a1a24; border-bottom: 1px solid rgba(34,211,238,.25); z-index: 10; }
    .eyebrow { color: #22d3ee; font-size: 11px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; }
    .counter { margin-top: 4px; color: #7f97a6; font-size: 11px; font-weight: 700; }
    .close { width: 30px; height: 30px; border: 1px solid rgba(255,255,255,.1); background: #11202b; color: #a5bccb; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; }
    .close:hover { background: rgba(34,211,238,.25); color: #fff; }
    .notes { flex: 1; padding: 24px 22px 90px; overflow-y: auto; }
    .pane-label { margin-bottom: 16px; color: #5f7686; font-size: 10px; font-weight: 900; letter-spacing: .13em; text-transform: uppercase; }
    .pv-tag { font-size: 11px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; }
    h2 { margin: 10px 0 18px; color: #eef7fb; font-size: 24px; line-height: 1.2; font-weight: 800; }
    .pv-text { font-size: 16px; line-height: 1.65; color: #d4e6ef; }
    .pv-text p { margin-bottom: 14px; }
    .pv-text p:first-child { font-weight: 600; color: #f0f9ff; }
    .pv-callout { margin-top: 18px; padding: 14px 16px; border-radius: 10px; background: rgba(168,85,247,.1); border-left: 4px solid #a855f7; color: #e2ccfb; font-size: 14px; line-height: 1.5; }
    .pv-callout .f { font-family: 'JetBrains Mono', monospace; font-weight: 800; color: #fff; }
    .pv-tip { margin-top: 14px; padding: 13px 15px; border-radius: 10px; background: rgba(16,185,129,.08); border: 1px dashed rgba(16,185,129,.4); color: #bdeed7; font-size: 13.5px; line-height: 1.55; }
    .pv-tip b { color: #eafff5; font-weight: 700; }
    .pv-tip-label { display: block; margin-bottom: 6px; color: #10b981; font-size: 10px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; }
    footer { position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: #0a1a24; border-top: 1px solid rgba(34,211,238,.25); z-index: 10; }
    .p-nav-btn { width: 36px; height: 36px; font-size: 20px; font-weight: bold; border: 1px solid rgba(255,255,255,.1); background: #11202b; color: #a5bccb; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
    .p-nav-btn:hover:not(:disabled) { border-color: #22d3ee; color: #fff; background: rgba(34,211,238,.2); }
    .p-nav-btn:disabled { opacity: .25; cursor: default; }
    .dots-wrap { flex: 1; display: flex; justify-content: center; gap: 6px; }
    .p-dot { width: 8px; height: 8px; border-radius: 50%; border: 0; background: #2b3f4d; cursor: pointer; transition: all 0.2s; }
    .p-dot.active { width: 22px; border-radius: 4px; background: var(--p-dot); box-shadow: 0 0 10px var(--p-dot); }
  </style>
</head>
<body></body>
</html>`);
    presenterWindow.document.close();
    presenterWindow.addEventListener('pagehide', () => { btnPresenter.textContent = '🖥 Пульт'; });
    btnPresenter.textContent = '🖥 Пульт открыт';
    renderPresenter(currentSlide);
    presenterWindow.focus();
  }

  // ── Event Listeners ──
  btnPrev.onclick = () => goToSlide(currentSlide - 1, { forceSpeak: voiceToggle.checked });
  btnNext.onclick = () => goToSlide(currentSlide + 1, { forceSpeak: voiceToggle.checked });
  btnRestart.onclick = () => goToSlide(0, { forceSpeak: voiceToggle.checked });
  btnPresenter.onclick = openPresenter;
  btnPlay.onclick = () => {
    if (isPlaying && ttsAudio) { ttsAudio.pause(); isPlaying = false; btnPlay.textContent = '▶ Играть'; }
    else if (!isPlaying && ttsAudio) { ttsAudio.play(); isPlaying = true; btnPlay.textContent = '⏸ Пауза'; }
    else speakSlide(currentSlide);
  };
  voiceToggle.addEventListener('change', () => {
    if (!voiceToggle.checked && ttsAudio) {
      ttsAudio.pause(); ttsAudio = null; isPlaying = false;
      btnPlay.textContent = '▶ Играть'; progressBar.style.width = '0%';
    }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); btnNext.click(); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); btnPrev.click(); }
    if (e.key === 'p' || e.key === 'P') { e.preventDefault(); openPresenter(); }
  });

  // ── Boot ──
  resizeCanvas();
  buildUI();
  const hashSlide = parseInt((location.hash || '').replace('#', ''), 10);
  const startIndex = Number.isInteger(hashSlide) && hashSlide >= 1 && hashSlide <= slidesData.length ? hashSlide - 1 : 0;
  currentSlide = startIndex;
  initScene(startIndex);
  updateUI();
  prefetch(startIndex);
  prefetch(startIndex + 1);
  requestAnimationFrame(animate);
  /* ── remote slide sync (active only with ?room=) ── */
  if (window.PrezaSync && window.PrezaSync.active) {
    var __prezaApplying = false, __lastApplied = '';
    var __sync = window.PrezaSync.attach({
      deckId: 'block_design',
      getState: function () { return { slide: currentSlide, voiceOn: !!voiceToggle.checked, playing: !!isPlaying }; },
      applyState: function (s) {
        var __k = s.slide + '|' + (!!s.voiceOn) + '|' + (!!s.playing);
        if (__k === __lastApplied) return;
        __lastApplied = __k;
        __prezaApplying = true;
        try {
          if (typeof s.voiceOn === 'boolean') voiceToggle.checked = s.voiceOn;
          if (typeof s.slide === 'number' && s.slide !== currentSlide) {
            goToSlide(s.slide, { forceSpeak: !!(s.voiceOn && s.playing) });
          } else {
            if (!s.voiceOn && ttsAudio) { ttsAudio.pause(); ttsAudio = null; isPlaying = false; btnPlay.textContent = '▶ Играть'; progressBar.style.width = '0%'; }
            else if (s.playing && !isPlaying) { if (ttsAudio) { ttsAudio.play(); isPlaying = true; btnPlay.textContent = '⏸ Пауза'; } else if (s.voiceOn) { speakSlide(currentSlide); } }
            else if (!s.playing && isPlaying && ttsAudio) { ttsAudio.pause(); isPlaying = false; btnPlay.textContent = '▶ Играть'; }
          }
        } finally { __prezaApplying = false; }
      }
    });
    var __pub = function () { if (!__prezaApplying) __sync.publish(); };
    var __origGo = goToSlide; goToSlide = function (i, o) { __origGo(i, o); __pub(); };
    var __origPlay = btnPlay.onclick; btnPlay.onclick = function (e) { if (__origPlay) __origPlay.call(this, e); __pub(); };
    voiceToggle.addEventListener('change', __pub);
    __pub();
  }
})();
</script>
</body>
</html>
