<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Пульт докладчика</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%; overflow: hidden;
      font-family: 'Inter', -apple-system, sans-serif;
      background: #030810; color: #e0f0e8;
      -webkit-text-size-adjust: 100%;
    }
    body { display: flex; flex-direction: column; }

    /* ── Header ── */
    .header {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: max(10px, env(safe-area-inset-top)) 16px 10px;
      border-bottom: 1px solid rgba(88,166,255,0.16);
      background: rgba(5,12,22,0.98);
      flex-shrink: 0;
    }
    .header-brand {
      font-size: 0.72rem; font-weight: 800;
      color: #58a6ff; text-transform: uppercase; letter-spacing: 0.08em;
      display: flex; align-items: center; gap: 8px; min-width: 0;
    }
    .menu-back {
      border: 1px solid rgba(88,166,255,0.3); background: rgba(88,166,255,0.08);
      color: #9ec8ff; border-radius: 8px; padding: 5px 10px; font: 700 0.72rem inherit;
      cursor: pointer; white-space: nowrap;
    }
    .menu-back:active { background: rgba(88,166,255,0.18); }
    .header-title { font-weight: 800; color: #cfe0f5; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .header-counter {
      font-size: 0.74rem; font-weight: 800; color: #cfe0f5;
      background: rgba(88,166,255,0.1); border: 1px solid rgba(88,166,255,0.2);
      padding: 4px 12px; border-radius: 20px; white-space: nowrap;
    }

    /* ── Body ── */
    .body { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 18px 16px; -webkit-overflow-scrolling: touch; }
    .wrap { max-width: 780px; margin: 0 auto; animation: fadeIn 0.26s ease-out; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

    /* ── Deck menu ── */
    .menu-head { color: #7fa8d8; font-size: 0.68rem; font-weight: 900; letter-spacing: 0.14em; text-transform: uppercase; margin: 4px 4px 14px; }
    .deck-card {
      display: flex; align-items: center; gap: 14px; width: 100%;
      padding: 16px 16px; margin-bottom: 10px;
      background: rgba(255,255,255,0.03); border: 1px solid rgba(120,150,190,0.18);
      border-radius: 14px; cursor: pointer; text-align: left; color: inherit; font: inherit;
      transition: transform 0.08s, border-color 0.15s, background 0.15s;
    }
    .deck-card:active { transform: scale(0.99); background: rgba(88,166,255,0.08); }
    .deck-ico { font-size: 1.5rem; flex: 0 0 auto; width: 34px; text-align: center; }
    .deck-body { flex: 1; min-width: 0; }
    .deck-title { font-size: 1.02rem; font-weight: 800; color: #eef4fb; }
    .deck-desc { font-size: 0.8rem; color: #7e94ad; margin-top: 2px; }
    .deck-n { flex: 0 0 auto; font-size: 0.72rem; font-weight: 800; color: #6f86a0; }

    /* ── Teleprompter ── */
    .pane-label { margin: 2px 0 12px; color: #5f7c9c; font-size: 0.62rem; font-weight: 900; letter-spacing: 0.14em; text-transform: uppercase; }
    .pv-text { font-size: clamp(1.08rem, 3.7vw, 1.34rem); line-height: 1.72; color: #dbe7f5; }
    .pv-text p { margin: 0 0 15px; }
    .pv-text p:last-child { margin-bottom: 0; }
    .pv-text p:first-child { font-weight: 600; color: #f0f6fc; }
    .pv-loading, .pv-muted { color: #57708c; font-style: italic; }

    /* ── Footer nav ── */
    .footer {
      flex-shrink: 0; display: flex; align-items: center; gap: 10px;
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
      border-top: 1px solid rgba(255,255,255,0.06); background: rgba(3,8,16,0.96);
    }
    .footer.hidden { display: none; }
    .nav-btn {
      flex: 1; min-height: 56px;
      border: 1px solid rgba(88,166,255,0.28); border-radius: 12px; background: rgba(88,166,255,0.09);
      color: #a9cdff; font-size: 1.02rem; font-weight: 800; cursor: pointer; font-family: inherit;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: transform 0.08s, background 0.15s, opacity 0.15s;
      user-select: none; touch-action: manipulation;
    }
    .nav-btn:active:not(:disabled) { transform: scale(0.97); background: rgba(88,166,255,0.18); }
    .nav-btn.next { flex: 1.4; background: rgba(88,166,255,0.16); color: #cbe2ff; border-color: rgba(88,166,255,0.45); }
    .nav-btn:disabled { opacity: 0.22; cursor: not-allowed; }
    .icon-btn {
      flex: 0 0 auto; width: 52px; min-height: 56px; border-radius: 12px;
      border: 1px solid rgba(120,150,190,0.28); background: rgba(255,255,255,0.03);
      color: #9fb6d0; font-size: 1.2rem; cursor: pointer; font-family: inherit;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.08s, background 0.15s;
    }
    .icon-btn:active { transform: scale(0.95); }
    .icon-btn.on { background: rgba(88,166,255,0.2); color: #cbe2ff; border-color: rgba(88,166,255,0.5); }
    .icon-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    @media (max-width: 480px) { .nav-btn { min-height: 60px; } }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-brand" id="brand">🎙 Пульт докладчика</div>
    <div class="header-counter" id="counter" hidden>— / —</div>
  </div>

  <div class="body" id="body"></div>

  <div class="footer hidden" id="footer">
    <button class="nav-btn prev" id="prev-btn">‹ Назад</button>
    <button class="icon-btn" id="voice-btn" title="Озвучка на общем экране (вкл/выкл)">🔈</button>
    <button class="icon-btn" id="play-btn" title="Играть/пауза озвучки" disabled>▶</button>
    <button class="nav-btn next" id="next-btn">Вперёд ›</button>
  </div>

  <!-- Force LEAD on a fresh open (this page's whole job is to drive). sessionStorage
       guard means a later "Отдать управление" (drops ?role=) is not re-forced. -->
  <script>
    (function () {
      var p = new URLSearchParams(location.search);
      if (!p.has('role') && !p.has('sync') && !sessionStorage.getItem('pultRoleSet')) {
        sessionStorage.setItem('pultRoleSet', '1');
        p.set('role', 'lead');
        location.replace(location.pathname + '?' + p.toString() + location.hash);
      }
    })();
  </script>
  <script src="mqtt.min.js"></script>
  <script src="preza-sync.js"></script>
  <script>
  (function () {
    'use strict';
    // All sync-wired presentations. `key` = PRES_TEXTS key (narration text).
    // `id` = deckId published over sync (must match each deck's adapter).
    // `page`/`count` are used by preza-sync's cross-page follow + the counter.
    var DECKS = [
      { id: 'block_design', key: 'block_design', count: 12, icon: '◆',  title: 'Блок-дизайн',                    desc: 'Комбинаторика баланса: BIBD, Фано, Штейнер' },
      { id: 'rea',          key: 'rea',          count: 9, icon: '🔎', title: 'REA — Reverse Engineer Anything', desc: 'ИИ-агент разбирает чужой софт · применение в simulator' },
      { id: 'llm_testing',  key: 'llm_testing',  count: 8,  icon: '🧪', title: 'LLM в тестировании',             desc: 'Harness и разбор падений автотестов' },
      { id: 'router_cve',   key: 'router_cve',   count: 10, icon: '🛰️', title: 'ИИ-агент против роутера',        desc: 'Как ИИ нашёл и оформил CVE' },
      { id: 'cham_v2',      key: 'cham_v2',      count: 12, icon: '🎬', title: 'Chemical Abstract Machine v2',   desc: 'Кинематографичная версия' },
      { id: 'cham',         key: 'cham',         count: 10, icon: '⚗️', title: 'Chemical Abstract Machine',      desc: '«структура = порядок»' },
      { id: 'antares_v2',   key: 'antares_v2',   count: 8,  icon: '🛡️', title: 'Cisco Antares v2',               desc: 'Оценка применимости' },
      { id: 'antares',      key: 'antares',      count: 8,  icon: '🎯', title: 'Cisco Antares',                  desc: 'ИИ-локализация уязвимостей' },
      { id: 'chloroplasts', key: 'chloroplasts', count: 13, icon: '🌿', title: 'Танец Хлоропластов',             desc: 'Математика растительных клеток' }
    ];
    function deckById(id) { for (var i = 0; i < DECKS.length; i++) if (DECKS[i].id === id) return DECKS[i]; return null; }

    var brandEl   = document.getElementById('brand');
    var counterEl = document.getElementById('counter');
    var bodyEl    = document.getElementById('body');
    var footerEl  = document.getElementById('footer');
    var prevBtn   = document.getElementById('prev-btn');
    var nextBtn   = document.getElementById('next-btn');
    var voiceBtn  = document.getElementById('voice-btn');
    var playBtn   = document.getElementById('play-btn');

    var deck = null;        // selected deck object
    var current = 0;        // current slide index
    var voiceOn = false;    // TTS on the shared screen?
    var playing = false;    // TTS playing?
    var narrationCache = {};// key -> { i -> html }
    var renderToken = 0;
    var narrationBase = null; // '/api/tts-script' | 'narration' — detected once

    // ── remote sync: this pult is LEAD; shared screen mirrors deck.id ──
    var syncApi = null;
    // One adapter whose deckId we mutate as the presenter picks decks. publish only
    // fires once a deck is selected (getState guards on `deck`).
    var adapter = {
      deckId: '__pult__',
      isActive: function () { return true; },
      getState: function () { return { slide: current, voiceOn: voiceOn, playing: playing }; },
      applyState: function () {} // lead ignores inbound; nothing to reconcile
    };
    if (window.PrezaSync && window.PrezaSync.active) {
      syncApi = window.PrezaSync.attach(adapter);
      liftBadge(20); // keep preza-sync's badge off our footer nav
    }
    function publish() { if (syncApi && deck) syncApi.publish(); }

    function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

    // Split flat narration into 2-sentence paragraphs (reading comfort only).
    function narrationToHtml(text) {
      var sentences = (text.match(/[^.!?…]+[.!?…]+["»)]*\s*/g) || [text]).map(function (s) { return s.trim(); }).filter(Boolean);
      var paras = [];
      for (var i = 0; i < sentences.length; i += 2) paras.push(sentences.slice(i, i + 2).join(' '));
      return paras.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') || esc(text);
    }

    // Narration text works both on the live server (/api/tts-script) and on the
    // static bundle (narration/<key>/<i>.json). Detect which base responds once.
    function urlsFor(key, i) {
      return ['/api/tts-script?pres=' + key + '&slide=' + i, 'narration/' + key + '/' + i + '.json'];
    }
    function fetchNarration(key, i) {
      var candidates = urlsFor(key, i);
      var order = narrationBase === 'narration' ? [candidates[1], candidates[0]] : candidates;
      function attempt(n) {
        if (n >= order.length) return Promise.reject(new Error('no narration'));
        return fetch(order[n]).then(function (r) {
          if (!r.ok) throw new Error('bad');
          narrationBase = order[n].indexOf('narration/') === 0 ? 'narration' : '/api/tts-script';
          return r.json();
        }).catch(function () { return attempt(n + 1); });
      }
      return attempt(0);
    }

    function loadNarration(index, target) {
      var cache = narrationCache[deck.key] || (narrationCache[deck.key] = {});
      if (cache[index] != null) { target.innerHTML = cache[index]; return; }
      target.innerHTML = '<p class="pv-loading">Загрузка текста…</p>';
      var token = ++renderToken;
      fetchNarration(deck.key, index)
        .then(function (payload) {
          var html = narrationToHtml((payload && payload.text) || '');
          cache[index] = html;
          if (token === renderToken) target.innerHTML = html;
        })
        .catch(function () {
          if (token === renderToken) target.innerHTML = '<p class="pv-muted">Текст озвучки недоступен (нет сервера/файла).</p>';
        });
    }

    // ── deck menu ──
    function showMenu() {
      deck = null;
      brandEl.textContent = '🎙 Пульт докладчика';
      counterEl.hidden = true;
      footerEl.classList.add('hidden');
      var html = '<div class="wrap"><div class="menu-head">Выбери презентацию — листаешь здесь, общий экран повторяет</div>';
      for (var i = 0; i < DECKS.length; i++) {
        var d = DECKS[i];
        html += '<button class="deck-card" data-id="' + d.id + '">' +
          '<span class="deck-ico">' + d.icon + '</span>' +
          '<span class="deck-body"><span class="deck-title">' + esc(d.title) + '</span>' +
          '<span class="deck-desc">' + esc(d.desc) + '</span></span>' +
          '<span class="deck-n">' + d.count + ' сл.</span></button>';
      }
      html += '</div>';
      bodyEl.innerHTML = html;
      bodyEl.scrollTop = 0;
      var cards = bodyEl.querySelectorAll('.deck-card');
      for (var j = 0; j < cards.length; j++) {
        (function (id) { cards[j].addEventListener('click', function () { selectDeck(id); }); })(cards[j].getAttribute('data-id'));
      }
    }

    function selectDeck(id) {
      var d = deckById(id);
      if (!d) return;
      deck = d;
      adapter.deckId = d.id;   // preza-sync now publishes under this deck
      current = 0; playing = false; // keep voiceOn as chosen; reset play on deck change
      brandEl.innerHTML = '<button class="menu-back" id="back-btn">≡ Презентации</button><span class="header-title">' + esc(d.title) + '</span>';
      document.getElementById('back-btn').addEventListener('click', showMenu);
      counterEl.hidden = false;
      footerEl.classList.remove('hidden');
      renderSlide();
      publish();
    }

    function renderSlide() {
      counterEl.textContent = (current + 1) + ' / ' + deck.count;
      prevBtn.disabled = current === 0;
      nextBtn.disabled = current === deck.count - 1;
      nextBtn.textContent = current === deck.count - 1 ? 'Конец' : 'Вперёд ›';
      updateVoiceUi();
      bodyEl.innerHTML = '<div class="wrap"><div class="pane-label">Текст озвучки · слайд ' + (current + 1) + '</div>' +
        '<div class="pv-text" id="narration"></div></div>';
      loadNarration(current, document.getElementById('narration'));
      bodyEl.scrollTop = 0;
    }

    function updateVoiceUi() {
      voiceBtn.classList.toggle('on', voiceOn);
      voiceBtn.textContent = voiceOn ? '🔊' : '🔈';
      playBtn.disabled = !voiceOn;
      playBtn.textContent = playing ? '⏸' : '▶';
      playBtn.classList.toggle('on', voiceOn && playing);
    }

    function go(idx) {
      if (!deck) return;
      idx = Math.max(0, Math.min(deck.count - 1, idx));
      if (idx === current) return;
      current = idx;
      renderSlide();
      publish();
    }

    prevBtn.addEventListener('click', function () { go(current - 1); });
    nextBtn.addEventListener('click', function () { go(current + 1); });
    voiceBtn.addEventListener('click', function () {
      if (!deck) return;
      voiceOn = !voiceOn;
      if (!voiceOn) playing = false;   // turning voice off stops playback on the shared screen
      updateVoiceUi();
      publish();
    });
    playBtn.addEventListener('click', function () {
      if (!deck || !voiceOn) return;
      playing = !playing;              // shared screen plays/pauses this slide's TTS
      updateVoiceUi();
      publish();
    });
    document.addEventListener('keydown', function (e) {
      if (!deck) return;
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); go(current + 1); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); go(current - 1); }
    });

    // preza-sync pins its status badge bottom-right, over our footer nav on a phone.
    // Lift it above the footer. The badge is the fixed box with the sentinel z-index.
    function liftBadge(tries) {
      var boxes = document.querySelectorAll('div');
      for (var i = 0; i < boxes.length; i++) {
        if (boxes[i].style && boxes[i].style.zIndex === '2147483000') {
          boxes[i].style.bottom = 'calc(env(safe-area-inset-bottom) + 96px)';
          return;
        }
      }
      if (tries > 0) setTimeout(function () { liftBadge(tries - 1); }, 120);
    }

    // Deep-link: presenter.html?deck=<id> opens straight into that deck.
    var wanted = new URLSearchParams(location.search).get('deck');
    if (wanted && deckById(wanted)) selectDeck(wanted); else showMenu();
  })();
  </script>
</body>
</html>
